<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>নৈকাঠী ফাউন্ডেশন</title>
<style>
body{margin:0;font-family:Arial;background:#f2f7f3}
header{background:#087a3d;color:white;text-align:center;padding:15px}
nav{display:flex;overflow:auto;background:white}
nav button{border:0;background:white;padding:11px;white-space:nowrap}
section{display:none;padding:15px}
section:first-of-type{display:block}
button.add{background:#087a3d;color:white;border:0;padding:10px 15px;border-radius:6px}
.card{background:white;padding:12px;margin:10px 0;border-radius:7px}
table{width:100%;border-collapse:collapse;background:white}
td,th{border:1px solid #ddd;padding:7px;text-align:center}
th{background:#087a3d;color:white}
</style>
</head>

<body>

<header>
<h2>🌿 নৈকাঠী ফাউন্ডেশন</h2>
<p>মানবতার সেবায় একসাথে</p>
</header>

<nav>
<button onclick="go('home')">🏠 হোম</button>
<button onclick="go('member')">👥 সদস্য</button>
<button onclick="go('income')">💰 মাসিক আয়</button>
<button onclick="go('donation')">🎁 দান</button>
<button onclick="go('expense')">💸 ব্যয়</button>
<button onclick="go('payment')">💳 টাকা দেওয়ার মাধ্যম</button>
<button onclick="go('activity')">🤝 কার্যক্রম</button>
<button onclick="go('document')">📄 ডকুমেন্ট</button>
<button onclick="go('social')">📱 Facebook/Messenger</button>
<button onclick="go('note')">📝 লেখা</button>
</nav>

<section id="home">
<h3>🏠 নৈকাঠী ফাউন্ডেশন</h3>
<div class="card">
মাসিক আয়: ৳<b id="ti">0</b><br><br>
দান: ৳<b id="td">0</b><br><br>
ব্যয়: ৳<b id="te">0</b>
</div>
</section>

<section id="member"><h3>👥 সদস্য</h3>
<button class="add" onclick="add('member')">➕ Add করুন</button>
<div id="memberList"></div></section>

<section id="income"><h3>💰 মাসিক আয়</h3>
<select id="month" onchange="incomeShow()">
<option>জানুয়ারি</option><option>ফেব্রুয়ারি</option><option>মার্চ</option>
<option>এপ্রিল</option><option>মে</option><option>জুন</option>
<option>জুলাই</option><option>আগস্ট</option><option>সেপ্টেম্বর</option>
<option>অক্টোবর</option><option>নভেম্বর</option><option>ডিসেম্বর</option>
</select>
<button class="add" onclick="add('income')">➕ Add করুন</button>
<div class="card">এখন পর্যন্ত: ৳<b id="mt">0</b></div>
<table><thead><tr><th>নাম</th><th>তারিখ</th><th>মাস</th><th>টাকা</th></tr></thead>
<tbody id="incomeList"></tbody></table></section>

<section id="donation"><h3>🎁 এককালীন দান</h3>
<button class="add" onclick="add('donation')">➕ Add করুন</button>
<div id="donationList"></div></section>

<section id="expense"><h3>💸 ব্যয়</h3>
<button class="add" onclick="add('expense')">➕ Add করুন</button>
<div id="expenseList"></div></section>

<section id="payment"><h3>💳 টাকা দেওয়ার মাধ্যম</h3>
<button class="add" onclick="add('payment')">➕ Add করুন</button>
<div id="paymentList"></div></section>

<section id="activity"><h3>🤝 কার্যক্রম</h3>
<button class="add" onclick="add('activity')">➕ Add করুন</button>
<div id="activityList"></div></section>

<section id="document"><h3>📄 ডকুমেন্ট</h3>
<button class="add" onclick="add('document')">➕ Add করুন</button>
<div id="documentList"></div></section>

<section id="social"><h3>📱 Facebook / Messenger</h3>
<button class="add" onclick="add('social')">➕ Add করুন</button>
<div id="socialList"></div></section>

<section id="note"><h3>📝 লেখা</h3>
<button class="add" onclick="add('note')">➕ Add করুন</button>
<div id="noteList"></div></section>

<script>
let d=JSON.parse(localStorage.getItem("nf")||'{"member":[],"income":[],"donation":[],"expense":[],"payment":[],"activity":[],"document":[],"social":[],"note":[]}');

let fields={
member:["নাম","মোবাইল","ব্লাড গ্রুপ","মাসিক ধার্য"],
income:["নাম","তারিখ","কোন মাসের","টাকা"],
donation:["দাতার নাম","তারিখ","টাকা"],
expense:["খরচের নাম","তারিখ","টাকা"],
payment:["মাধ্যমের নাম","নম্বর/অ্যাকাউন্ট"],
activity:["কার্যক্রমের নাম","তারিখ","বিবরণ"],
document:["ডকুমেন্টের নাম","লিংক"],
social:["Facebook/Messenger নাম","লিংক"],
note:["শিরোনাম","লেখা"]
};

function save(){localStorage.setItem("nf",JSON.stringify(d));showAll()}

function go(x){
document.querySelectorAll("section").forEach(s=>s.style.display="none");
document.getElementById(x).style.display="block";
if(x=="income")incomeShow();
}

function add(t){
let o={};
for(let f of fields[t]){
o[f]=prompt(f);
if(o[f]===null)return;
}
d[t].push(o);save();
}

function list(t){
let e=document.getElementById(t+"List");
if(!e)return;
e.innerHTML=d[t].map(x=>
`<div class="card">${Object.entries(x).map(a=>`<b>${a[0]}:</b> ${a[1]}<br>`).join("")}</div>`
).join("");
}

function incomeShow(){
let m=document.getElementById("month").value;
let a=d.income.filter(x=>x["কোন মাসের"]==m);
document.getElementById("incomeList").innerHTML=a.map(x=>
`<tr><td>${x["নাম"]}</td><td>${x["তারিখ"]}</td><td>${x["কোন মাসের"]}</td><td>৳${x["টাকা"]}</td></tr>`
).join("");
document.getElementById("mt").innerText=a.reduce((s,x)=>s+(+x["টাকা"]||0),0);
}

function showAll(){
["member","donation","expense","payment","activity","document","social","note"].forEach(list);
incomeShow();
ti.innerText=d.income.reduce((s,x)=>s+(+x["টাকা"]||0),0);
td.innerText=d.donation.reduce((s,x)=>s+(+x["টাকা"]||0),0);
te.innerText=d.expense.reduce((s,x)=>s+(+x["টাকা"]||0),0);
}
showAll();
</script>

</body>
</html>
