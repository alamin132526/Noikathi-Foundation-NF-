<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>নৈকাঠী ফাউন্ডেশন</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f2f7f4;color:#222}
header{background:#087a3d;color:white;text-align:center;padding:20px}
nav{display:flex;overflow:auto;background:white;position:sticky;top:0}
nav button{border:0;background:white;padding:12px;white-space:nowrap}
section{padding:15px;display:none}
section.active{display:block}
.add{background:#087a3d;color:white;border:0;padding:10px 15px;border-radius:6px}
.card{background:white;margin:10px 0;padding:12px;border-radius:8px;box-shadow:0 1px 5px #ccc}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:5px}
.action{margin-top:8px}
.edit{background:#e6a700;color:white;border:0;padding:6px}
.del{background:#d33;color:white;border:0;padding:6px}
</style>
</head>

<body>

<header>
<h2>🌿 নৈকাঠী ফাউন্ডেশন</h2>
<p>মানবতার সেবায় একসাথে</p>
</header>

<nav>
<button onclick="show('home')">হোম</button>
<button onclick="show('member')">সদস্য</button>
<button onclick="show('income')">মাসিক আয়</button>
<button onclick="show('donation')">এককালীন দান</button>
<button onclick="show('expense')">ব্যয়</button>
<button onclick="show('payment')">টাকা দেওয়ার মাধ্যম</button>
<button onclick="show('activity')">কার্যক্রম</button>
<button onclick="show('document')">ডকুমেন্ট</button>
<button onclick="show('social')">Facebook/Messenger</button>
<button onclick="show('note')">লেখা</button>
</nav>

<section id="home" class="active">
<h3>🏠 স্বাগতম</h3>
<p>নৈকাঠী ফাউন্ডেশন একটি মানবিক ও সামাজিক উদ্যোগ।</p>
<div class="card">
<h3>📊 হিসাবের সারাংশ</h3>
<p>মাসিক আয়: ৳ <b id="totalIncome">0</b></p>
<p>এককালীন দান: ৳ <b id="totalDonation">0</b></p>
<p>মোট ব্যয়: ৳ <b id="totalExpense">0</b></p>
</div>
</section>

<section id="member">
<h3>👥 সদস্য তালিকা</h3>
<button class="add" onclick="addMember()">➕ Add করুন</button>
<div id="members"></div>
</section>

<section id="income">
<h3>💰 মাসিক আয়</h3>
<button class="add" onclick="addIncome()">➕ Add করুন</button>
<div id="incomes"></div>
</section>

<section id="donation">
<h3>🎁 এককালীন দান</h3>
<button class="add" onclick="addDonation()">➕ Add করুন</button>
<div id="donations"></div>
</section>

<section id="expense">
<h3>💸 ব্যয়</h3>
<button class="add" onclick="addExpense()">➕ Add করুন</button>
<div id="expenses"></div>
</section>

<section id="payment">
<h3>💳 টাকা দেওয়ার মাধ্যম</h3>
<button class="add" onclick="addPayment()">➕ Add করুন</button>
<div id="payments"></div>
</section>

<section id="activity">
<h3>🤝 কার্যক্রম</h3>
<button class="add" onclick="addActivity()">➕ Add করুন</button>
<div id="activities"></div>
</section>

<section id="document">
<h3>📄 ডকুমেন্ট</h3>
<button class="add" onclick="addDocument()">➕ Add করুন</button>
<div id="documents"></div>
</section>

<section id="social">
<h3>📱 Facebook / Messenger</h3>
<button class="add" onclick="addSocial()">➕ Add করুন</button>
<div id="socials"></div>
</section>

<section id="note">
<h3>📝 লেখা</h3>
<button class="add" onclick="addNote()">➕ Add করুন</button>
<div id="notes"></div>
</section>

<script>
const key="naikathiFoundation";
let data=JSON.parse(localStorage.getItem(key)||'{"member":[],"income":[],"donation":[],"expense":[],"payment":[],"activity":[],"document":[],"social":[],"note":[]}');

function save(){localStorage.setItem(key,JSON.stringify(data));render()}
function show(id){
 document.querySelectorAll("section").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

function ask(title,fields){
 let o={};
 for(let f of fields){
  let v=prompt(f[0],f[1]||"");
  if(v===null)return null;
  o[f[1]]=v;
 }
 o.id=Date.now();
 return o;
}

function addMember(){
 let o=ask("সদস্য",[
 ["নাম","name"],["মোবাইল","mobile"],["ব্লাড গ্রুপ","blood"],["মাসিক ধার্য","amount"]]);
 if(o){data.member.push(o);save()}
}
function addIncome(){
 let o=ask("মাসিক আয়",[
 ["নাম","name"],["তারিখ","date"],["মাস","month"],["টাকার পরিমাণ","amount"]]);
 if(o){data.income.push(o);save()}
}
function addDonation(){
 let o=ask("এককালীন দান",[
 ["দাতার নাম","name"],["তারিখ","date"],["মাস","month"],["টাকার পরিমাণ","amount"]]);
 if(o){data.donation.push(o);save()}
}
function addExpense(){
 let o=ask("ব্যয়",[
 ["খরচের বিবরণ","name"],["তারিখ","date"],["টাকার পরিমাণ","amount"]]);
 if(o){data.expense.push(o);save()}
}
function addPayment(){
 let o=ask("টাকা দেওয়ার মাধ্যম",[
 ["মাধ্যমের নাম (বিকাশ/নগদ/ব্যাংক)","name"],["নম্বর/অ্যাকাউন্ট","number"],["অতিরিক্ত তথ্য","info"]]);
 if(o){data.payment.push(o);save()}
}
function addActivity(){
 let o=ask("কার্যক্রম",[
 ["কার্যক্রমের নাম","name"],["তারিখ","date"],["বিবরণ","info"]]);
 if(o){data.activity.push(o);save()}
}
function addDocument(){
 let o=ask("ডকুমেন্ট",[
 ["ডকুমেন্টের নাম","name"],["লিংক","link"]]);
 if(o){data.document.push(o);save()}
}
function addSocial(){
 let o=ask("সোশ্যাল লিংক",[
 ["নাম (Facebook/Messenger)","name"],["লিংক","link"]]);
 if(o){data.social.push(o);save()}
}
function addNote(){
 let o=ask("লেখা",[
 ["শিরোনাম","name"],["বিস্তারিত লেখা","info"]]);
 if(o){data.note.push(o);save()}
}

function edit(type,id){
 let o=data[type].find(x=>x.id==id);
 if(!o)return;
 for(let k in o){
  if(k!="id"){
   let v=prompt(k,o[k]);
   if(v!==null)o[k]=v;
  }
 }
 save();
}

function del(type,id){
 if(confirm("এই তথ্যটি মুছে ফেলবেন?")){
  data[type]=data[type].filter(x=>x.id!=id);
  save();
 }
}

function render(){
 let map={
 member:"members",income:"incomes",donation:"donations",
 expense:"expenses",payment:"payments",activity:"activities",
 document:"documents",social:"socials",note:"notes"
 };
 for(let type in map){
  let box=document.getElementById(map[type]);
  box.innerHTML="";
  data[type].forEach(o=>{
   let text="";
   for(let k in o)if(k!="id")text+=`<p><b>${k}:</b> ${o[k]}</p>`;
   box.innerHTML+=`
   <div class="card">
   ${text}
   <div class="action">
   <button class="edit" onclick="edit('${type}',${o.id})">✏️ Edit</button>
   <button class="del" onclick="del('${type}',${o.id})">🗑️ Delete</button>
   </div></div>`;
  });
 }

 document.getElementById("totalIncome").innerText=
 data.income.reduce((s,x)=>s+(Number(x.amount)||0),0);

 document.getElementById("totalDonation").innerText=
 data.donation.reduce((s,x)=>s+(Number(x.amount)||0),0);

 document.getElementById("totalExpense").innerText=
 data.expense.reduce((s,x)=>s+(Number(x.amount)||0),0);
}

render();
</script>

</body>
</html>
