<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>নৈকাঠী ফাউন্ডেশন</title>
<style>
body{font-family:Arial;margin:0;background:#f2fff5}
header{background:#087a3d;color:white;text-align:center;padding:15px}
section{background:white;margin:10px;padding:12px;border-radius:10px}
h2{color:#087a3d}input,textarea{width:90%;padding:7px;margin:3px}
button{background:#087a3d;color:white;border:0;padding:7px;border-radius:5px}
.item{border-bottom:1px solid #ddd;padding:7px}
</style>
</head>
<body>

<header><h1>🌿 নৈকাঠী ফাউন্ডেশন</h1><p>মানবতার সেবায় একসাথে</p></header>

<div id="app"></div>

<script>
let D=JSON.parse(localStorage.getItem("NF")||"{}");
let S=[
["member","👥 সদস্য","নাম,মোবাইল,ব্লাড গ্রুপ,মাসিক ধার্য"],
["income","💰 মাসিক আয়","নাম,তারিখ,টাকার পরিমাণ"],
["donation","🎁 এককালীন দান","দাতার নাম,তারিখ,টাকার পরিমাণ"],
["expense","💸 ব্যয়","বিবরণ,তারিখ,টাকার পরিমাণ"],
["bKash","📱 বিকাশ","বিকাশ নম্বর / তথ্য"],
["Nagad","📱 নগদ","নগদ নম্বর / তথ্য"],
["Bank","🏦 ব্যাংক","ব্যাংকের নাম,অ্যাকাউন্ট নম্বর,শাখা"],
["Facebook","🔵 Facebook Group","Facebook Group Link"],
["Messenger","💬 Messenger Group","Messenger Group Link"],
["activity","🤝 কার্যক্রম","কার্যক্রমের নাম,বিস্তারিত"]
];

let A=document.getElementById("app");
S.forEach(x=>{
 let [id,title,fields]=x;
 A.innerHTML+=`<section><h2>${title}</h2>
 ${fields.split(",").map((f,i)=>`<input id="${id}${i}" placeholder="${f}">`).join("")}
 <button onclick="add('${id}',${fields.split(",").length})">+ Add করুন</button>
 <div id="${id}L"></div></section>`;
});

function add(t,n){
 D[t]=D[t]||[];
 D[t].push([...Array(n)].map((_,i)=>document.getElementById(t+i).value));
 localStorage.setItem("NF",JSON.stringify(D));show();
}
function show(){
 S.forEach(x=>{
  let [id]=x,L=document.getElementById(id+"L");
  L.innerHTML=(D[id]||[]).map((r,i)=>
  `<div class="item">${r.join(" | ")} <button onclick="del('${id}',${i})">মুছুন</button></div>`).join("");
 });
}
function del(t,i){D[t].splice(i,1);localStorage.setItem("NF",JSON.stringify(D));show()}
show();
</script>

</body>
</html>
